{% extends 'base.html' %}

{% block head %}
{% endblock %}

{% block body %}
<div class="atm-screen-bezel">
    <div class="atm-buttons-left">
        <button class="atm-side-btn"></button>
        <button class="atm-side-btn"></button>
        <button class="atm-side-btn"></button>
        <button class="atm-side-btn"></button>
    </div>

    <div class="crt-screen">
        <h2>=== ACCOUNT DASHBOARD ===</h2>
        <h2 style="color: #ffffff; margin: 10px 0;">BALANCE: {{ total }} $</h2>
        <hr style="border: 0; border-top: 1px dashed #00ff00; margin: 8px 0;">

        <p style="text-align: center;">SELECT DEPOSIT AMOUNT:</p>
        <form method="POST" action="/home" style="text-align: center;">
            <button type="submit" name="Money" value="1000" class="crt-btn">+ $1000</button>
            <button type="submit" name="Money" value="100" class="crt-btn">+ $100</button>
            <button type="submit" name="Money" value="10" class="crt-btn">+ $10</button>
            <button type="submit" name="Money" value="1" class="crt-btn">+ $1</button>
        </form>

        <div style="display: flex; justify-content: space-around; margin-top: 10px;">
            <form method="POST" action="/logout" style="display:inline;">
                <button type="submit" class="crt-btn" style="background-color: #444; color: #fff;">LOGOUT</button>
            </form>

            <form method="POST" action="/Bankreset" style="display:inline;">
                <button type="submit" class="crt-btn" style="background-color: #663333; color: #ff9999;">RESET</button>
            </form>

            <form method="POST" action="/delete" style="display:inline;">
                <button type="submit" class="crt-btn" style="background-color: #660000; color: #ffffff;">DELETE</button>
            </form>
        </div>
    </div>

    <div class="atm-buttons-right">
        <button class="atm-side-btn"></button>
        <button class="atm-side-btn"></button>
        <button class="atm-side-btn"></button>
        <button class="atm-side-btn"></button>
    </div>
</div>


{% endblock %}
