{% extends 'base.html' %}

{% block head %}
{% endblock %}

{% block body %}

<div style="text-align: center; border: 3px double #ffffff; padding: 15px; background-color: #000066; width: 700px; margin: 0 auto;">

    <h1>=== ACCOUNT DASHBOARD ===</h1>

    <h2>Total money: {{ total }} $</h2>
    <hr style="border: 1px solid #ffff00; width: 60%;">

    <p>Select deposit amount:</p>
    <form method="POST" action="/home">
        <button type="submit" name="Money" value="1000">Add 1000 Dollars</button>
        <button type="submit" name="Money" value="100">Add 100 Dollars</button>
        <button type="submit" name="Money" value="10">Add 10 Dollars</button>
        <button type="submit" name="Money" value="1">Add 1 Dollars</button>
    </form>

    <br>
    <hr style="border: 1px dashed #c0c0c0; width: 40%;">

    <form method="POST" action="/logout">
        <button type="submit" style="background-color: #e0e0e0;">Logout</button>
    </form>

    <form method="POST" action="/Bankreset">
        <button type="submit" style="background-color: #ffcccc;">Bankreset</button>
    </form>

    <form method="POST" action="/delete">
        <button type="submit" style="background-color: #ff0000; color: white;">DELETE ACCOUNT</button>
    </form>

</div>

{% endblock %}
