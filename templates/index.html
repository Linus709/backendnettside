
{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}

<div class="atm-screen-bezel">
    <!-- Left ATM Side Buttons -->
    <div class="atm-buttons-left">
        <button type="button" class="atm-side-btn"></button>
        <button type="button" class="atm-side-btn"></button>
        <button type="button" class="atm-side-btn"></button>
        <button type="button" class="atm-side-btn"></button>
    </div>

    <!-- CRT Monitor Display -->
    <div class="crt-screen">
        <h2>=== 1995 ATM NETWORK ===</h2>
        <p style="text-align: center;">[SECURE MEMBER LOGIN]</p>
        <hr style="border: 0; border-top: 1px dashed #00ff00; margin: 10px 0;">

        <form method="POST">
            <p>USER ID:</p>
            <div>
                <input type="text" name="username" placeholder="ENTER USERNAME" required>
            </div>

            <p>PIN CODE:</p>
            <div>
                <input type="password" name="password" id="password" placeholder="ENTER PIN" maxlength="20" required>
            </div>

            <div style="text-align: center; margin-top: 15px;">
                <button type="submit" name="action" value="register" class="crt-btn">REGISTER</button>
                <button type="submit" name="action" value="login" class="crt-btn">LOGIN</button>
            </div>
        </form>
    </div>

    <!-- Right ATM Side Buttons -->
    <div class="atm-buttons-right">
        <button type="button" class="atm-side-btn"></button>
        <button type="button" class="atm-side-btn"></button>
        <button type="button" class="atm-side-btn"></button>
        <button type="button" class="atm-side-btn"></button>
    </div>
</div>

<!-- Bottom Physical ATM Panel (Keypad & Admin PIN) -->
<div class="atm-control-panel">
    <div class="atm-slot"></div>

    <div class="keypad-section">
        <form method="POST" action="/adminpin" id="adminForm">
            <div style="text-align: center;">
                <input type="password" id="pin" name="admin_pin" placeholder="PIN" readonly>
            </div>
            
            <div class="atm-keypad">
                <button type="button" class="keypad-btn" onclick="addnumber('1')">1</button>
                <button type="button" class="keypad-btn" onclick="addnumber('2')">2</button>
                <button type="button" class="keypad-btn" onclick="addnumber('3')">3</button>
                <button type="button" class="keypad-btn" onclick="addnumber('4')">4</button>
                <button type="button" class="keypad-btn" onclick="addnumber('5')">5</button>
                <button type="button" class="keypad-btn" onclick="addnumber('6')">6</button>
                <button type="button" class="keypad-btn" onclick="addnumber('7')">7</button>
                <button type="button" class="keypad-btn" onclick="addnumber('8')">8</button>
                <button type="button" class="keypad-btn" onclick="addnumber('9')">9</button>
                <button type="button" class="keypad-btn clear" onclick="cleardigit()">CLR</button>
                <button type="button" class="keypad-btn" onclick="addnumber('0')">0</button>
                <button type="submit" class="keypad-btn enter">ENT</button>
            </div>
        </form>
    </div>

    <!-- Card Reader -->
    <div class="card-reader">
        <div style="font-size: 8px; color: #aaa; margin-bottom: 2px;">CARD</div>
        <div class="card-slot-line"></div>
    </div>
</div>

<!-- ATM Slogan -->
<div class="Slagord" style="text-align: center; margin-top: 15px;">
    <p>*** DIRECTATE APPROVED 1995 ATM SYSTEM ***</p>
</div>

{% endblock %}
